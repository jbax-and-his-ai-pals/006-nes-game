# A single flat 8 KiB CHR bank, no header -- just raw pattern-table bytes,
# for a manifest-driven CHR asset (see assets/banks/manifest.json and
# tools/pack_mmc3.py) that isn't a copy of the shared common bank.
MEMORY {
    CHRBANK: file = %O, start = $0000, size = $2000, fill = yes;
}
SEGMENTS {
    CHARS: load = CHRBANK, type = ro;
}
